<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bn.png" />
    <link rel="apple-touch-icon" href="/bn.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Blacnova Client Portal</title>
    <style>
      html, body, #app {
        margin: 0;
        min-height: 100%;
        background: #f5f5f5;
        font-family: Poppins, system-ui, sans-serif;
      }
      .bn-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #6b7280;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .bn-boot__mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #d4611c;
        margin: 0 auto 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="bn-boot" role="status" aria-live="polite">
        <div>
          <div class="bn-boot__mark" aria-hidden="true"></div>
          Loading Blacnova…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
